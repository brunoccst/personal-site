<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BC">
  <rect width="64" height="64" rx="12" fill="#000000" />
  <g
    fill="none"
    stroke="#d8b878"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- B: the stem is broken either side of the waist, so the letter keeps its
         silhouette while the vertical stays interrupted -->
    <path d="M13 17 L13 27" />
    <path d="M13 37 L13 47" />
    <path d="M13 17 H21 C27 17, 29 20, 29 24 C29 28, 27 31.5, 21 31.5 H13" />
    <path d="M13 31.5 H22 C28 31.5, 30 35, 30 39 C30 43, 28 47, 22 47 H13" />
    <!-- C, matched to the B's height so the pair reads as capitals -->
    <path d="M51 21 C44 15.5, 36 20.5, 36 32 C36 43.5, 44 48.5, 51 43" />
  </g>
</svg>
